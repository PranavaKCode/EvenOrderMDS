    Pranava Kumar devised the mathematical argument. Claude (Anthropic)
    assisted him in translating it into Lean 4, producing the original
    development for Lean v4.24.0. An AI agent (Claude Opus 5.5 in Claude Code)
    then ported that development to Lean v4.35.0-rc2 and the module system,
    wrote Challenge.lean and Solution.lean, and drafted this repository's
    README, this metadata file, the accompanying report and the supplementary
    Python checks. Pranava Kumar is responsible for the submission. The
    statement was audited against the standard conjecture and the proof checked
    by Comparator; no independent human expert has reviewed the mathematics.

fidelity:
  divergences: >-
    None known relative to the standard statement of the conjecture for even q
    (Ball 2012, Conjecture 1.4; MacWilliams–Sloane, Chapter 11). The
    conjecture's range 2 ≤ k ≤ q is kept in full; the theorem states the exact
    maximum, so it also covers the exceptional dimensions 3 and q − 1. "Even
    order" is expressed as Even (Fintype.card K), equivalent to characteristic
    two.

review:
  status: agent-reviewed
  reviewers:
    - "Claude Opus 5.5 (AI agent): statement audit against the standard conjecture and supporting computer checks"
  notes: >-
    The Challenge statement was compared with the formulations in Ball (2012)
    and MacWilliams–Sloane (1977). The template's checks were run locally:
    scripts/check-lean-sources.py passes, lake build succeeds, and
    scripts/verify-comparator.sh reports that the proof of
    EvenOrderMDS.maximum_length_of_MDS_code is accepted by Lean's kernel, NanoDa
    and con-ron using only propext, Quot.sound and Classical.choice.
    Independently of Lean, Python programs checked each lemma of
    the informal argument on 250 explicit plane arcs over F_8, F_16, F_32 and
    F_64 and computed the exact maximum lengths over F_2, F_4 and F_8 by
    exhaustive search. No review by a human expert has taken place.

alignment:
  namespace: "EvenOrderMDS"
  statements:
    - source: "MDS conjecture for even q (Ball 2012, Conjecture 1.4); Theorem 1.1 of docs/report.pdf"
      lean: "EvenOrderMDS.maximum_length_of_MDS_code"
      module: "Challenge"
      status: "proved"
      note: >-
        IsGreatest encodes both attainment and the upper bound; HasMinimumDistance
        and IsMDS are the literal coding-theoretic notions.

acknowledgements: >-
